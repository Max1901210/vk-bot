name: vk-bot-keepalive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Пульс для бота на Render (не даёт заснуть)
        run: |
          curl -s -o /dev/null -w "пульс: %{http_code}\n" "${{ secrets.PING_URL }}" || true
