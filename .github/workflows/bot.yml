name: vk-bot

on:
  schedule:
    - cron: "*/5 * * * *"   # каждые 5 минут
  workflow_dispatch: {}      # кнопка «Run workflow» для ручного теста

permissions:
  contents: write

jobs:
  duty:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Дежурство бота
        run: python bot_once.py
        env:
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
          VK_GROUP_ID: ${{ secrets.VK_GROUP_ID }}
          AI_KEY: ${{ secrets.AI_KEY }}
          PROVIDER: openrouter
          RUN_SECONDS: "260"
      - name: Сохранить память бота
        run: |
          git config user.email "bot@users.noreply.github.com"
          git config user.name "vk-bot"
          git add bot_state.json
          git diff --cached --quiet || (git commit -m "память бота" && git push)
